; drone_updater — ESP32-C3 / ESP32-S3 "Super Mini" BLE OTA flasher for a
; Seeed XIAO nRF52840 running the Adafruit nRF52 bootloader (Legacy DFU).

[platformio]
default_envs = esp32c3_supermini, esp32s3_supermini

[esp32_common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.1.0
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  ; Serial goes over the chip's native USB (USB-Serial/JTAG on both boards).
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Central-only BLE client: drop the roles we don't use to save flash/RAM.
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32c3_supermini]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_common.build_flags}
  -D BOARD_C3_SUPERMINI
  -D LED_PIN=8
  -D LED_ACTIVE_LOW=1

[env:esp32s3_supermini]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
  ${esp32_common.build_flags}
  -D BOARD_S3_SUPERMINI
  -D RGB_LED_PIN=48

; Host unit tests for the pure parsers (zip, manifest, config).
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<zip_reader.cpp> +<firmware_zip.cpp> +<config.cpp>
build_flags = -std=c++17 -I src
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
